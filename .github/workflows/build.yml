name: Build

# Em todo push/PR: confere o frontend e compila o app no Windows e no macOS.
# Ao criar uma tag v* (ex.: v0.1.0): gera os instaladores num release rascunho.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run check

      # Com tag v*: publica a versão no repo público credix-desktop-releases (o código
      # aqui continua privado). O app instalado lê o latest.json de lá para se
      # atualizar sozinho, conferindo a assinatura feita com a chave abaixo.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          owner: lucyanpeixoto
          repo: credix-desktop-releases
          # A tag é criada no repo de releases, que não tem os commits daqui.
          commitish: main
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'Credix PDV ${{ github.ref_name }}'
          releaseBody: 'Baixe o instalador abaixo. Caixas já instalados se atualizam sozinhos.'
          # Rascunho não conta como "latest": a atualização automática não veria.
          releaseDraft: false
          updaterJsonPreferNsis: true

      # Sem tag: guarda os instaladores como artefato do build para testar.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: credix-pdv-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
