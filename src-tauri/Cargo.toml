[package]
name = "credix-desktop"
version = "0.2.11"
description = "Credix PDV - venda e recebimento no balcão"
authors = ["Lucyan Peixoto"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "credix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }

# Binário pequeno e rápido: o PDV tem que ser leve.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
